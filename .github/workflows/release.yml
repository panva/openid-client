name: Release

permissions: {}

on:
  push:
    tags: ['v6.[0-9]+.[0-9]+']

jobs:
  release:
    permissions:
      actions: read # Download the package artifact.
      attestations: write # Store package attestations.
      artifact-metadata: write # Record package attestation metadata.
      contents: write # Publish releases and update release branches.
      discussions: write # Create release discussions.
      id-token: write # Authenticate trusted publishing and attestations.
    uses: panva/.github/.github/workflows/npm-release.yml@a4736719ab55fdedeee01739c175e01bff32386f # v1
    with:
      artifact_check_command: node tools/test-dist.js "$PACKAGE_TARBALL" .
      cleanup_paths: '["build"]'
      prepare_command: >-
        npm clean-install &&
        npm run build &&
        npm run typecheck:dist &&
        npm run typecheck:types &&
        npm run check:packaging &&
        git diff --exit-code
      publish_jsr: true
